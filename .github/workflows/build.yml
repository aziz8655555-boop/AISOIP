name: Build AISOIP APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/personal/aisoip
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AISOIP'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.personal.aisoip'
              compileSdk 35
              buildToolsVersion '35.0.0'

              defaultConfig {
                  applicationId 'com.personal.aisoip'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_lock.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#101827"
                  android:pathData="M0,0H48V48H0Z"/>
              <path android:strokeColor="#EBC477"
                  android:strokeWidth="3"
                  android:pathData="M16,21V15C16,4 32,4 32,15V21"/>
              <path android:fillColor="#EBC477"
                  android:pathData="M12,20H36V39H12Z"/>
              <path android:fillColor="#101827"
                  android:pathData="M22,26H26V34H22Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="АИС ОИП"
                  android:icon="@drawable/ic_lock"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/adblock.js <<'EOF'
          (function () {
              var css = [
                  '.adsbygoogle', '.advertisement', '.advertising', '.advert',
                  '.ad-banner', '.banner-ad', '.ad-sidebar', '.sidebar-ad',
                  '.sidebar-ads', '.left-ad', '.right-ad', '.left-ads',
                  '.right-ads', '.ad-left', '.ad-right', '.ads-container',
                  '.ad-container', '.ad-overlay', '.popup-ad', '.sticky-ad',
                  '.floating-ad', '.ads-block', '#ad-left', '#ad-right',
                  '#left-ads', '#right-ads', '#ads', '#advertisement',
                  '[data-ad-slot]', '[data-ad-client]', '[id^=google_ads_]',
                  '[id^=div-gpt-ad]', 'iframe[src*=doubleclick]',
                  'iframe[src*=googlesyndication]', 'iframe[src*=exoclick]',
                  'iframe[src*=exosrv]', 'iframe[src*=juicyads]',
                  'iframe[src*=trafficjunky]', 'iframe[src*=popads]',
                  'iframe[src*=adsterra]', 'iframe[src*=realsrv]'
              ].join(',') + '{display:none!important;visibility:hidden!important;}';

              function installStyle() {
                  var s = document.getElementById('aisoip-adblock');
                  if (!s) {
                      s = document.createElement('style');
                      s.id = 'aisoip-adblock';
                      s.textContent = css;
                      (document.head || document.documentElement).appendChild(s);
                  } else if (s.textContent !== css) {
                      s.textContent = css;
                  }
              }
              installStyle();

              // Additional bottom-banner filter, only on the original site.
              if (!/(^|\.)hochu\.tv$/i.test(location.hostname)) return;
              if (window.__aisoipBottomFilter) return;
              window.__aisoipBottomFilter = true;

              var adNames = /(?:^|[\s_-])(?:ads?|advert(?:isement|ising)?|reklama|реклама|sponsor(?:ed)?)(?:$|[\s_-])/i;
              var bottomNames = /bottom|footer|sticky|anchor|fixed|floating|dock/i;
              var player = 'video,audio,[role="slider"],input,textarea,select,[class*="player" i],[id*="player" i],[class*="controls" i]';
              var pending = false;

              function scan() {
                  pending = false;
                  installStyle();
                  if (!document.body) return;
                  var nodes = document.querySelectorAll('div,aside,section,ins,iframe,footer,[role="banner"]');
                  for (var i = 0; i < nodes.length; i++) {
                      var el = nodes[i];
                      var s = getComputedStyle(el);
                      if (s.display === 'none' || s.visibility === 'hidden') continue;
                      var name = (el.id || '') + ' ' + (el.getAttribute('class') || '');
                      var label = (el.getAttribute('aria-label') || '') + ' ' + (el.getAttribute('title') || '');
                      var namedAd = adNames.test(name) || /(?:bottom|sticky|anchor|footer|floating)(?:ad|ads|advert)|(?:ad|ads|advert)(?:bottom|sticky|anchor|footer|floating)/i.test(name);
                      var fixed = s.position === 'fixed' || s.position === 'sticky';
                      if (!fixed && !(namedAd && bottomNames.test(name))) continue;
                      var rect = el.getBoundingClientRect();
                      var h = window.innerHeight || document.documentElement.clientHeight;
                      if (rect.height < 10 || rect.height > Math.min(280, h * 0.45) || rect.bottom < h - 48 || rect.top < h * 0.48) continue;
                      var text = (el.innerText || '').trim();
                      var labelledAd = /реклама|advertisement|sponsored/i.test(label) || (text.length < 140 && /^(?:реклама(?:\s|$|:)|advertisement\b|sponsored\b|пропустить рекламу)/i.test(text));
                      if (!namedAd && !labelledAd) continue;
                      if (el.matches(player) || el.querySelector(player) || el.closest('[class*="player" i],[id*="player" i]')) continue;
                      // An iframe with no explicit ad identity may be a player.
                      if ((el.tagName === 'IFRAME' || el.querySelector('iframe')) && !namedAd) continue;
                      el.setAttribute('data-aisoip-hidden', '1');
                      el.style.setProperty('display', 'none', 'important');
                      el.style.setProperty('visibility', 'hidden', 'important');
                  }
              }
              function schedule() {
                  if (pending) return;
                  pending = true;
                  setTimeout(scan, 120);
              }
              var observer = new MutationObserver(schedule);
              observer.observe(document.documentElement, {
                  childList: true, subtree: true, attributes: true,
                  attributeFilter: ['class','id','style','aria-label','title'],
                  characterData: true
              });
              window.addEventListener('resize', schedule);
              window.addEventListener('pageshow', schedule);
              schedule();
          })();
          EOF

          cat > app/src/main/java/com/personal/aisoip/MainActivity.java <<'EOF'
          package com.personal.aisoip;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.content.res.Configuration;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.*;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String PIN = "0088";
              private static final String SITE_URL = "https://hochu.tv/";
              private final int BG = Color.rgb(16,24,39);
              private final int GOLD = Color.rgb(235,196,119);
              private final int KEY = Color.rgb(37,50,71);
              private String entered = "";
              private boolean unlocked = false;
              private TextView dots;
              private TextView message;
              private WebView web;
              private int failures = 0;
              private long blockedUntil = 0;
              private String adScript;

              private static final String[] AD_DOMAINS = {
                  "doubleclick.net", "googlesyndication.com",
                  "googleadservices.com", "adservice.google.com",
                  "adnxs.com", "exoclick.com", "exosrv.com",
                  "trafficjunky.net", "trafficjunky.com", "juicyads.com",
                  "popads.net", "popcash.net", "propellerads.com",
                  "adsterra.com", "hilltopads.net", "clickadu.com",
                  "adcash.com", "realsrv.com", "adform.net", "adfox.ru",
                  "taboola.com", "outbrain.com", "mgid.com", "adnium.com",
                  "plugrush.com"
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  showPin();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private void mount(View view) {
                  setContentView(view);
                  view.setOnApplyWindowInsetsListener((v, insets) -> {
                      if (Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets i = insets.getInsets(
                              WindowInsets.Type.systemBars() |
                              WindowInsets.Type.displayCutout()
                          );
                          v.setPadding(i.left, i.top, i.right, i.bottom);
                      } else {
                          v.setPadding(
                              insets.getSystemWindowInsetLeft(),
                              insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(),
                              insets.getSystemWindowInsetBottom()
                          );
                      }
                      return insets;
                  });
                  view.requestApplyInsets();
              }

              private GradientDrawable background(int color, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  return d;
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private void destroyWeb() {
                  if (web != null) {
                      web.stopLoading();
                      android.view.ViewParent parent = web.getParent();
                      if (parent instanceof android.view.ViewGroup) {
                          ((android.view.ViewGroup) parent).removeView(web);
                      }
                      web.destroy();
                      web = null;
                  }
              }

              private void showPin() {
                  unlocked = false;
                  entered = "";
                  destroyWeb();
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  scroll.addView(root);
                  boolean landscape = getResources().getConfiguration().orientation
                      == Configuration.ORIENTATION_LANDSCAPE;
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(landscape ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);
                  panel.setGravity(Gravity.CENTER);
                  root.addView(panel);
                  LinearLayout info = new LinearLayout(this);
                  info.setOrientation(LinearLayout.VERTICAL);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(dp(20), dp(10), dp(20), dp(10));
                  panel.addView(info);
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.ic_lock);
                  info.addView(logo, new LinearLayout.LayoutParams(dp(70), dp(70)));
                  TextView title = text("АИС ОИП", 30, GOLD);
                  info.addView(title);
                  TextView subtitle = text("Введите ПИН-код", 19, Color.WHITE);
                  subtitle.setPadding(0, dp(12), 0, dp(12));
                  info.addView(subtitle);
                  dots = text("○  ○  ○  ○", 28, GOLD);
                  info.addView(dots);
                  message = text(" ", 15, Color.RED);
                  info.addView(message);
                  LinearLayout keyboard = new LinearLayout(this);
                  keyboard.setOrientation(LinearLayout.VERTICAL);
                  keyboard.setGravity(Gravity.CENTER);
                  panel.addView(keyboard);
                  String[] keys = {"1","2","3","4","5","6","7","8","9","","0","⌫"};
                  int diameter = landscape ? 52 : 68;
                  for (int r = 0; r < 4; r++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setGravity(Gravity.CENTER);
                      keyboard.addView(row);
                      for (int c = 0; c < 3; c++) {
                          final String number = keys[r * 3 + c];
                          TextView button = text(number, 27, Color.WHITE);
                          LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(dp(diameter), dp(diameter));
                          params.setMargins(dp(7), dp(5), dp(7), dp(5));
                          if (!number.isEmpty()) {
                              button.setBackground(background(KEY, 100));
                              button.setElevation(dp(4));
                              button.setOnClickListener(v -> press(number));
                          }
                          row.addView(button, params);
                      }
                  }
                  mount(scroll);
              }

              private void updateDots() {
                  if (dots == null) return;
                  StringBuilder result = new StringBuilder();
                  for (int i = 0; i < 4; i++) {
                      result.append(i < entered.length() ? "●" : "○");
                      if (i < 3) result.append("  ");
                  }
                  dots.setText(result.toString());
              }

              private void press(String number) {
                  if (android.os.SystemClock.elapsedRealtime() < blockedUntil) {
                      message.setText("Подождите 30 секунд");
                      return;
                  }
                  message.setText(" ");
                  if (number.equals("⌫")) {
                      if (!entered.isEmpty()) {
                          entered = entered.substring(0, entered.length() - 1);
                      }
                  } else if (entered.length() < 4) {
                      entered += number;
                  }
                  updateDots();
                  if (entered.length() == 4) {
                      if (entered.equals(PIN)) {
                          failures = 0;
                          openSite();
                      } else {
                          entered = "";
                          updateDots();
                          failures++;
                          if (failures >= 5) {
                              blockedUntil = android.os.SystemClock.elapsedRealtime() + 30000;
                              failures = 0;
                              message.setText("Подождите 30 секунд");
                          } else {
                              message.setText("Неверный ПИН-код");
                          }
                      }
                  }
              }

              private boolean isAdHost(Uri uri) {
                  if (uri == null) return false;
                  String host = uri.getHost();
                  if (host == null) return false;
                  host = host.toLowerCase(Locale.ROOT);
                  for (String domain : AD_DOMAINS) {
                      if (host.equals(domain) || host.endsWith("." + domain)) return true;
                  }
                  return false;
              }

              private boolean allowedPage(Uri uri) {
                  if (uri == null) return false;
                  return "https".equalsIgnoreCase(uri.getScheme()) && !isAdHost(uri);
              }

              private WebResourceResponse blockedResponse() {
                  return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream(new byte[0]));
              }

              private void hideAds(WebView view) {
                  if (view == null || view != web) return;
                  if (adScript == null) {
                      try (InputStream in = getAssets().open("adblock.js");
                           ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                          byte[] buffer = new byte[4096];
                          int n;
                          while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                          adScript = out.toString("UTF-8");
                      } catch (java.io.IOException e) {
                          android.util.Log.e("AISOIP", "Ad filter load failed", e);
                          return;
                      }
                  }
                  view.evaluateJavascript(adScript, null);
              }

              private void openSite() {
                  unlocked = true;
                  entered = "";
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, false);
                  if (Build.VERSION.SDK_INT >= 26) settings.setSafeBrowsingEnabled(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return isAdHost(request.getUrl());
                          return !allowedPage(request.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return !allowedPage(Uri.parse(url));
                      }
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (isAdHost(request.getUrl())) return blockedResponse();
                          return super.shouldInterceptRequest(view, request);
                      }
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          if (isAdHost(Uri.parse(url))) return blockedResponse();
                          return super.shouldInterceptRequest(view, url);
                      }
                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          hideAds(view);
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          hideAds(view);
                          view.postDelayed(() -> hideAds(view), 1000);
                          view.postDelayed(() -> hideAds(view), 3000);
                      }
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, android.net.http.SslError error) {
                          handler.cancel();
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient());
                  mount(web);
                  web.loadUrl(SITE_URL);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (unlocked) {
                      showPin();
                  } else {
                      entered = "";
                      updateDots();
                  }
              }

              @Override
              public void onConfigurationChanged(Configuration config) {
                  super.onConfigurationChanged(config);
                  if (!unlocked) showPin();
              }

              @Override
              public void onBackPressed() {
                  if (unlocked && web != null && web.canGoBack()) {
                      web.goBack();
                  } else if (unlocked) {
                      showPin();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  destroyWeb();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AISOIP.apk
          ls -lh AISOIP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AISOIP-APK
          path: AISOIP.apk
          if-no-files-found: error
