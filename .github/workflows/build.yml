name: Build AISOIP APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/personal/aisoip
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AISOIP'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.personal.aisoip'
              compileSdk 35
              buildToolsVersion '35.0.0'

              defaultConfig {
                  applicationId 'com.personal.aisoip'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_lock.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">

              <path
                  android:fillColor="#101827"
                  android:pathData="M0,0H48V48H0Z"/>

              <path
                  android:strokeColor="#EBC477"
                  android:strokeWidth="3"
                  android:pathData="M16,21V15C16,4 32,4 32,15V21"/>

              <path
                  android:fillColor="#EBC477"
                  android:pathData="M12,20H36V39H12Z"/>

              <path
                  android:fillColor="#101827"
                  android:pathData="M22,26H26V34H22Z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET"/>

              <application
                  android:label="АИС ОИП"
                  android:icon="@drawable/ic_lock"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/personal/aisoip/MainActivity.java <<'EOF'
          package com.personal.aisoip;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.content.res.Configuration;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.*;

          public class MainActivity extends Activity {

              private static final String PIN = "0088";

              private static final String SITE_URL =
                  "https://aisoip.adilet.gov.kz/";

              private final int BG = Color.rgb(16,24,39);
              private final int GOLD = Color.rgb(235,196,119);
              private final int KEY = Color.rgb(37,50,71);

              private String entered = "";
              private boolean unlocked = false;

              private TextView dots;
              private TextView message;
              private WebView web;

              private int failures = 0;
              private long blockedUntil = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  showPin();
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources()
                      .getDisplayMetrics().density
                  );
              }

              private void mount(View view) {
                  setContentView(view);

                  view.setOnApplyWindowInsetsListener((v, insets) -> {

                      if (Build.VERSION.SDK_INT >= 30) {

                          android.graphics.Insets i =
                              insets.getInsets(
                                  WindowInsets.Type.systemBars() |
                                  WindowInsets.Type.displayCutout()
                              );

                          v.setPadding(
                              i.left,
                              i.top,
                              i.right,
                              i.bottom
                          );

                      } else {

                          v.setPadding(
                              insets.getSystemWindowInsetLeft(),
                              insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(),
                              insets.getSystemWindowInsetBottom()
                          );
                      }

                      return insets;
                  });

                  view.requestApplyInsets();
              }

              private GradientDrawable background(
                  int color, int radius
              ) {

                  GradientDrawable d =
                      new GradientDrawable();

                  d.setColor(color);
                  d.setCornerRadius(dp(radius));

                  return d;
              }

              private TextView text(
                  String value,
                  int size,
                  int color
              ) {

                  TextView t = new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);

                  return t;
              }

              private void destroyWeb() {

                  if (web != null) {

                      web.stopLoading();

                      android.view.ViewParent parent =
                          web.getParent();

                      if (parent instanceof android.view.ViewGroup) {

                          ((android.view.ViewGroup) parent)
                              .removeView(web);
                      }

                      web.destroy();
                      web = null;
                  }
              }

              private void showPin() {

                  unlocked = false;
                  entered = "";

                  destroyWeb();

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setGravity(Gravity.CENTER);

                  scroll.addView(root);

                  boolean landscape =
                      getResources()
                      .getConfiguration()
                      .orientation ==
                      Configuration.ORIENTATION_LANDSCAPE;

                  LinearLayout panel =
                      new LinearLayout(this);

                  panel.setOrientation(
                      landscape ?
                      LinearLayout.HORIZONTAL :
                      LinearLayout.VERTICAL
                  );

                  panel.setGravity(Gravity.CENTER);

                  root.addView(panel);

                  LinearLayout info =
                      new LinearLayout(this);

                  info.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  info.setGravity(Gravity.CENTER);

                  info.setPadding(
                      dp(20),
                      dp(10),
                      dp(20),
                      dp(10)
                  );

                  panel.addView(info);

                  ImageView logo =
                      new ImageView(this);

                  logo.setImageResource(
                      R.drawable.ic_lock
                  );

                  info.addView(
                      logo,
                      new LinearLayout.LayoutParams(
                          dp(70),
                          dp(70)
                      )
                  );

                  TextView title =
                      text("АИС ОИП", 30, GOLD);

                  info.addView(title);

                  TextView subtitle =
                      text(
                          "Введите ПИН-код",
                          19,
                          Color.WHITE
                      );

                  subtitle.setPadding(
                      0,
                      dp(12),
                      0,
                      dp(12)
                  );

                  info.addView(subtitle);

                  dots = text(
                      "○  ○  ○  ○",
                      28,
                      GOLD
                  );

                  info.addView(dots);

                  message = text(
                      " ",
                      15,
                      Color.RED
                  );

                  info.addView(message);

                  LinearLayout keyboard =
                      new LinearLayout(this);

                  keyboard.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  keyboard.setGravity(
                      Gravity.CENTER
                  );

                  panel.addView(keyboard);

                  String[] keys = {
                      "1","2","3",
                      "4","5","6",
                      "7","8","9",
                      "","0","⌫"
                  };

                  int diameter =
                      landscape ? 52 : 68;

                  for (int r = 0; r < 4; r++) {

                      LinearLayout row =
                          new LinearLayout(this);

                      row.setGravity(
                          Gravity.CENTER
                      );

                      keyboard.addView(row);

                      for (int c = 0; c < 3; c++) {

                          final String number =
                              keys[r * 3 + c];

                          TextView button =
                              text(
                                  number,
                                  27,
                                  Color.WHITE
                              );

                          LinearLayout.LayoutParams params =
                              new LinearLayout.LayoutParams(
                                  dp(diameter),
                                  dp(diameter)
                              );

                          params.setMargins(
                              dp(7),
                              dp(5),
                              dp(7),
                              dp(5)
                          );

                          if (!number.isEmpty()) {

                              button.setBackground(
                                  background(KEY, 100)
                              );

                              button.setElevation(dp(4));

                              button.setOnClickListener(
                                  v -> press(number)
                              );
                          }

                          row.addView(
                              button,
                              params
                          );
                      }
                  }

                  mount(scroll);
              }

              private void updateDots() {

                  if (dots == null) return;

                  StringBuilder result =
                      new StringBuilder();

                  for (int i = 0; i < 4; i++) {

                      result.append(
                          i < entered.length() ?
                          "●" : "○"
                      );

                      if (i < 3) {
                          result.append("  ");
                      }
                  }

                  dots.setText(
                      result.toString()
                  );
              }

              private void press(String number) {

                  if (
                      android.os.SystemClock.elapsedRealtime()
                      < blockedUntil
                  ) {

                      message.setText(
                          "Подождите 30 секунд"
                      );

                      return;
                  }

                  message.setText(" ");

                  if (number.equals("⌫")) {

                      if (!entered.isEmpty()) {

                          entered = entered.substring(
                              0,
                              entered.length() - 1
                          );
                      }

                  } else if (entered.length() < 4) {

                      entered += number;
                  }

                  updateDots();

                  if (entered.length() == 4) {

                      if (entered.equals(PIN)) {

                          failures = 0;

                          openSite();

                      } else {

                          entered = "";
                          updateDots();

                          failures++;

                          if (failures >= 5) {

                              blockedUntil =
                                  android.os.SystemClock
                                  .elapsedRealtime()
                                  + 30000;

                              failures = 0;

                              message.setText(
                                  "Подождите 30 секунд"
                              );

                          } else {

                              message.setText(
                                  "Неверный ПИН-код"
                              );
                          }
                      }
                  }
              }

              private void openSite() {

                  unlocked = true;
                  entered = "";

                  web = new WebView(this);

                  WebSettings settings =
                      web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  CookieManager.getInstance()
                      .setAcceptCookie(true);

                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(
                          web,
                          false
                      );

                  if (Build.VERSION.SDK_INT >= 26) {

                      settings.setSafeBrowsingEnabled(
                          true
                      );
                  }

                  web.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              if (!request.isForMainFrame()) {
                                  return false;
                              }

                              return !"https".equalsIgnoreCase(
                                  request.getUrl().getScheme()
                              );
                          }

                          @Override
                          public void onReceivedSslError(
                              WebView view,
                              SslErrorHandler handler,
                              android.net.http.SslError error
                          ) {

                              handler.cancel();
                          }
                      }
                  );

                  web.setWebChromeClient(
                      new WebChromeClient()
                  );

                  mount(web);

                  web.loadUrl(SITE_URL);
              }

              @Override
              protected void onStop() {

                  super.onStop();

                  if (unlocked) {

                      showPin();

                  } else {

                      entered = "";
                      updateDots();
                  }
              }

              @Override
              public void onConfigurationChanged(
                  Configuration config
              ) {

                  super.onConfigurationChanged(config);

                  if (!unlocked) {

                      showPin();
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      unlocked &&
                      web != null &&
                      web.canGoBack()
                  ) {

                      web.goBack();

                  } else if (unlocked) {

                      showPin();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  destroyWeb();

                  super.onDestroy();
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AISOIP.apk
          ls -lh AISOIP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AISOIP-APK
          path: AISOIP.apk
          if-no-files-found: error
